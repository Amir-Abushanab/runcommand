<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024"
     font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f141b"/>
      <stop offset="1" stop-color="#0a0c10"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="24%" r="55%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tri" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7de7f5"/>
      <stop offset="1" stop-color="#0aa5c2"/>
    </linearGradient>
    <linearGradient id="bgsq" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2129"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- logo, 64→200, centered -->
  <g transform="translate(412,180) scale(3.125)">
    <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgsq)" stroke="#30363d" stroke-width="1.5"/>
    <path d="M25 21 L45 32 L25 43 Z" fill="url(#tri)" stroke="url(#tri)" stroke-width="5.5" stroke-linejoin="round"/>
  </g>

  <text x="512" y="505" text-anchor="middle" font-size="84" font-weight="800" fill="#e9edf1" letter-spacing="-2">runcommand</text>
  <text x="512" y="572" text-anchor="middle" font-size="30" fill="#aab1bd">Your run command + live ports —</text>
  <text x="512" y="612" text-anchor="middle" font-size="30" fill="#aab1bd">in your status bar and prompt.</text>

  <!-- terminal card, centered -->
  <rect x="152" y="686" width="720" height="150" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="188" cy="720" r="7" fill="#ff5f57"/>
  <circle cx="212" cy="720" r="7" fill="#febc2e"/>
  <circle cx="236" cy="720" r="7" fill="#28c840"/>
  <path d="M186 755 L201 766 L186 777 Z" fill="#56d4dd"/>
  <text x="216" y="776" font-family="Menlo, monospace" font-size="30" fill="#56d4dd">pnpm dev</text>
  <circle cx="396" cy="766" r="7.5" fill="none" stroke="#56d4dd" stroke-width="3"/>
  <circle cx="396" cy="766" r="2.5" fill="#56d4dd"/>
  <text x="418" y="776" font-family="Menlo, monospace" font-size="30" fill="#56d4dd">:3000  :5173</text>
</svg>
