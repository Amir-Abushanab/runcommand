<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640"
     font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef1f5"/>
    </linearGradient>
    <radialGradient id="glow" cx="16%" cy="18%" r="60%">
      <stop offset="0" stop-color="#0aa5c2" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#0aa5c2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tri" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7de7f5"/>
      <stop offset="1" stop-color="#0aa5c2"/>
    </linearGradient>
    <linearGradient id="bgsq" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2129"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <g transform="translate(88,92) scale(2)">
    <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgsq)" stroke="#2c333d" stroke-width="1.5"/>
    <path d="M25 21 L45 32 L25 43 Z" fill="url(#tri)" stroke="url(#tri)" stroke-width="5.5" stroke-linejoin="round"/>
  </g>

  <text x="250" y="196" font-size="80" font-weight="800" fill="#15171c" letter-spacing="-2">runcommand</text>

  <text x="90" y="304" font-size="31" fill="#55606e">Your project's run command — and its live localhost ports —</text>
  <text x="90" y="348" font-size="31" fill="#55606e">in your status bar and shell prompt.</text>

  <!-- terminal card stays dark on the light background -->
  <rect x="88" y="410" width="1104" height="152" rx="16" fill="#0d1117" stroke="#d3d8e0" stroke-width="1.5"/>
  <circle cx="124" cy="444" r="7" fill="#ff5f57"/>
  <circle cx="148" cy="444" r="7" fill="#febc2e"/>
  <circle cx="172" cy="444" r="7" fill="#28c840"/>
  <text x="200" y="451" font-family="Menlo, monospace" font-size="20" fill="#8b949e">~/Code/principlestash.com</text>

  <path d="M120 501 L135 512 L120 523 Z" fill="#56d4dd"/>
  <text x="150" y="522" font-family="Menlo, monospace" font-size="30" fill="#56d4dd">pnpm dev</text>
  <circle cx="330" cy="512" r="7.5" fill="none" stroke="#56d4dd" stroke-width="3"/>
  <circle cx="330" cy="512" r="2.5" fill="#56d4dd"/>
  <text x="352" y="522" font-family="Menlo, monospace" font-size="30" fill="#56d4dd">:3000  :5173</text>

  <text x="90" y="602" font-size="22" fill="#6b7280">Claude Code · starship · OpenCode · Qwen Code — LLM-detected, cached, self-healing.</text>
</svg>
